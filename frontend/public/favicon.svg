<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e6fff"/>
      <stop offset="100%" stop-color="#0a2fa8"/>
    </linearGradient>
    <linearGradient id="s1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80c8ff"/>
      <stop offset="100%" stop-color="#3a8fff"/>
    </linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe644"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="3" y="3" width="32" height="20" rx="10" fill="rgba(255,255,255,0.07)"/>
  <!-- Blue helix strand -->
  <path d="M18 6 C18 6, 46 16, 46 32 C46 48, 18 58, 18 58"
        stroke="url(#s1)" stroke-width="4.5" fill="none"
        stroke-linecap="round" filter="url(#glow)"/>
  <!-- Yellow helix strand -->
  <path d="M46 6 C46 6, 18 16, 18 32 C18 48, 46 58, 46 58"
        stroke="url(#s2)" stroke-width="4.5" fill="none"
        stroke-linecap="round" filter="url(#glow)"/>
  <!-- Rungs -->
  <line x1="20" y1="12" x2="44" y2="17" stroke="rgba(255,255,255,0.60)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="36" y1="20" x2="28" y2="23" stroke="rgba(255,255,255,0.45)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="44" y2="30" stroke="rgba(255,255,255,0.70)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="28" y1="38" x2="36" y2="41" stroke="rgba(255,255,255,0.45)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="20" y1="47" x2="44" y2="52" stroke="rgba(255,255,255,0.60)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Dots at rung ends -->
  <circle cx="20" cy="30" r="2.5" fill="#80c8ff" opacity="0.9"/>
  <circle cx="44" cy="30" r="2.5" fill="#ffe644" opacity="0.9"/>
</svg>
